seed: 42
batch_size: 32
num_epochs: 20
phase1_epochs: 4
freeze_until_block: 4

# Head learns first; backbone stays much slower after unfreeze.
lr_head: 0.0003
lr_backbone: 0.00003
weight_decay: 0.0001
dropout: 0.4
label_smoothing: 0.05

base_weights: "models/best_model.pt"

train_paths:
  - "finetune_data/train"

val_paths:
  - "finetune_data/val"

early_stopping_patience: 6
log_every_n_steps: 10
save_top_k: 1

# --- Video Bi-GRU Settings ---
video_seq_len: 8
video_batch_size: 8
gru_epochs: 12
gru_hidden_dim: 256
gru_layers: 2
